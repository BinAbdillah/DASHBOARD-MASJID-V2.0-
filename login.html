<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Admin - Signage Masjid</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./css/login.css">
</head>
<body>
  <div class="login-card">
    <div class="login-title">LOGIN ADMIN SIGNAGE</div>
    <div class="form-group">
      <label>Email Pengurus</label>
      <input type="email" id="email" class="form-control" placeholder="admin@masjid.com">
    </div>
    <div class="form-group">
      <label>Password</label>
      <input type="password" id="password" class="form-control" placeholder="••••••••">
    </div>
    <button class="btn-login" id="btn-login">Masuk ke Admin Panel</button>
  </div>

  <script type="module" src="./js/login.js"></script>
</body>
</html>
